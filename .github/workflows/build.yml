name: Build CloudStream extension

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - "*.md"

permissions:
  contents: write

concurrency:
  group: bhoomtv-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          path: src
          ref: main

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.5

      - name: Build plugin
        working-directory: src
        run: gradle make makePluginsJson

      - name: Checkout builds branch
        uses: actions/checkout@v4
        with:
          path: builds
          ref: builds

      - name: Publish generated files
        run: |
          find builds -mindepth 1 -maxdepth 1 ! -name ".git" -exec rm -rf {} +
          cp src/repo.json builds/repo.json
          cp src/BhoomTV/build/*.cs3 builds/
          cp src/build/plugins.json builds/plugins.json

          cd builds
          git config user.name "adarsh7665-dev"
          git config user.email "258372729+adarsh7665-dev@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Build ${GITHUB_SHA}"
          git push origin builds
