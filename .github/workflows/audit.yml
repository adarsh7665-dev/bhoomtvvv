name: BHOOM org audit

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Test current .org site
        shell: bash
        run: |
          set -e
          for slug in kairali-tv mazhavil-hd mollywood-tv mollywood-plus; do
            page="https://bhoomtv.org/live/$slug/"
            echo "===== $page ====="
            curl --http1.1 --compressed -L --fail --silent --show-error --connect-timeout 5 --max-time 15 -A Mozilla/5.0 "$page" -o page.html
            echo "bytes=$(wc -c < page.html)"
            post=$(grep -o 'data-post="[0-9]*"' page.html | head -1 | grep -o '[0-9]*' || true)
            echo "post=$post"
            grep -o 'data-nume="[0-9]*"' page.html | sort -u | head -30 || true
            if [ -n "$post" ]; then
              for nume in $(grep -o 'data-nume="[0-9]*"' page.html | grep -o '[0-9]*' | sort -nu | head -20); do
                echo "--- nume=$nume ---"
                curl --http1.1 --compressed -L --fail --silent --show-error --connect-timeout 5 --max-time 12 -A Mozilla/5.0 -e "$page" -H 'Accept: application/json' "https://bhoomtv.org/wp-json/dooplayer/v2/$post/movie/$nume" || true
                echo
              done
            fi
          done
