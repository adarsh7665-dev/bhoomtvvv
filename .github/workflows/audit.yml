name: BHOOM media endpoint audit

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Test current media endpoints
        shell: bash
        run: |
          set -e
          test_url () {
            label="$1"
            url="$2"
            referer="$3"
            echo "===== $label ====="
            curl --http1.1 --compressed -L --silent --show-error --connect-timeout 5 --max-time 15 -A 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/130 Safari/537.36' -e "$referer" -H 'Accept: */*' -o /tmp/out -w 'status=%{http_code} type=%{content_type} bytes=%{size_download}\n' "$url" || true
            head -c 220 /tmp/out 2>/dev/null | tr '\r\n' ' ' || true
            echo
          }
          test_url 'Kairali #1' 'https://streams.tangotv.in/KAIRALI/ORIGIN/index.m3u8' 'https://bhoomtv.me/jwplayer/'
          test_url 'Mazhavil #1' 'https://ddozob4sbfsmt.cloudfront.net/out/v1/51aaeddf56854312add90dfa8df07e39/index.m3u8' 'https://bhoomtv.me/jwplayer/'
          test_url 'Mazhavil #2' 'https://mazhavil.keralive.workers.dev/v1/master/a0d007312bfd99c47f76b77ae26b1ccdaae76cb1/mm_https/index.m3u8' 'https://bhoomtv.me/jwplayer/'
          test_url 'Mazhavil #3' 'https://mmtv-vglivessai.akamaized.net/v1/master/673630b269b766886555eebfddd4f27f3de3ab50/f8a0827f-030f-4a0d-b7e5-338996c09a5b/index.m3u8' 'https://bhoomtv.me/jwplayer/'
          test_url 'Mazhavil #4' 'https://mmtv-mazhavil.vgcdn.net/vglive-sk-268476/index.m3u8' 'https://bhoomtv.me/jwplayer/'
          test_url 'Asianet Movies' 'https://as-net.keralive.workers.dev/v1/master/a0d007312bfd99c47f76b77ae26b1ccdaae76cb1/asianetmovies_live_https/index.m3u8' 'https://bhoomtv.me/jwplayer/'
          test_url 'Asianet Plus' 'https://as-net.keralive.workers.dev/v1/master/a0d007312bfd99c47f76b77ae26b1ccdaae76cb1/asianetplus_live_https/index.m3u8' 'https://bhoomtv.me/jwplayer/'
          test_url 'Surya TV' 'https://d3dt6rg724ecr3.cloudfront.net/SuryaTv/SuryaTV-HDR10-IN-index.m3u8' 'https://bhoomtv.me/jwplayer/'
          echo '=== B4U PLAYER ==='
          curl --http1.1 --compressed -L --silent --show-error --connect-timeout 5 --max-time 15 -A 'Mozilla/5.0' -e 'https://bhoomtv.me/live/kairali-tv/' 'https://b4uplay.com/player.php?mpd=https://login.bheem.tv/bpk-tv/22412/output/index.mpd?&keyId=1382b4f8623151e88c52787ae11f11ab&key=de71cbb248a62cc2c4a66c8546b49d7d' -o /tmp/b4u -w 'b4u-status=%{http_code} bytes=%{size_download}\n' || true
          grep -oE 'https?://[^[:space:]<>\"]+\.mpd[^[:space:]<>\"]*' /tmp/b4u 2>/dev/null | head -20 || true
          grep -iE 'keyId|key|mpd|source' /tmp/b4u 2>/dev/null | head -30 || true
