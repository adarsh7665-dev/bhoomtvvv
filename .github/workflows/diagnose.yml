name: BHOOM source diagnostics

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect BHOOM markup
        shell: bash
        run: |
          set -e
          for item in mollywood-tv mollywood-plus; do
            url="https://bhoomtv.me/live/$item/"
            echo "===== $item ====="
            curl -L --fail --silent --show-error -A "Mozilla/5.0" "$url" -o "$item.html"
            echo "bytes=$(wc -c < "$item.html")"
            echo "-- channel names --"
            grep -oiE 'Asianet[^<]{0,100}|Zee Keralam[^<]{0,100}|Surya[^<]{0,100}' "$item.html" | head -100 || true
            echo "-- source/player terms --"
            grep -oiE '.{0,250}(Sources|source|player|stream|playlist|m3u8|mpd|iframe|data-src|data-url).{0,500}' "$item.html" | head -120 || true
            echo "-- scripts --"
            grep -oiE '<script[^>]+src=[\"'"''][^\"'"'']+' "$item.html" | head -100 || true
            echo "-- direct stream URLs --"
            grep -oiE 'https?://[^\"'"''][^[:space:]<>]*(m3u8|mpd)[^\"'"'']*' "$item.html" | sort -u | head -200 || true
          done
