name: BHOOM source API diagnostics

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Query BHOOM source API
        shell: bash
        run: |
          set -e
          for item in mollywood-tv mollywood-plus; do
            url="https://bhoomtv.me/live/$item/"
            curl --http1.1 --compressed -L --fail --silent --show-error --connect-timeout 5 --max-time 15 -A Mozilla/5.0 "$url" -o page.html
            post=$(grep -oE 'data-post=["'"'][0-9]+'"'"']' page.html | head -1 | grep -oE '[0-9]+' | head -1)
            echo "===== $item post=$post ====="
            if [ "$item" = "mollywood-tv" ]; then indexes="3 6 8 10"; else indexes="1 4 5"; fi
            for nume in $indexes; do
              api="https://bhoomtv.me/wp-json/dooplayer/v2/$post/movie/$nume"
              echo "--- nume=$nume ---"
              curl --http1.1 --compressed -L --fail --silent --show-error --connect-timeout 5 --max-time 15 -A Mozilla/5.0 -H 'Accept: application/json' "$api" || true
              echo
            done
          done
