name: BHOOM player diagnostics

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect player script
        shell: bash
        run: |
          set -e
          curl --http1.1 --compressed -L --fail --silent --show-error --connect-timeout 5 --max-time 15 -A Mozilla/5.0 'https://bhoomtv.me/wp-content/themes/dooplay/assets/js/front.scripts.min.js?ver=2.5.5' -o player.js
          echo "bytes=$(wc -c < player.js)"
          python3 -c 'import re; p=open("player.js",errors="ignore").read(); terms=["admin-ajax.php","dooplay_player_ajax","dooplay_player_option","playeroptionsul"]; [print("### "+t+"\n"+"\n---\n".join(re.findall(r"(?is).{0,500}"+re.escape(t)+r".{0,1200}",p)[:10])) for t in terms]'
