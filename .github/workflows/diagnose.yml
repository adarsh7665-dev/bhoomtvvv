name: BHOOM source diagnostics

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect BHOOM markup
        shell: bash
        run: |
          set -e
          for item in mollywood-tv mollywood-plus; do
            url="https://bhoomtv.me/live/$item/"
            echo "===== $item ====="
            curl -L --fail --silent --show-error -A Mozilla/5.0 "$url" -o "$item.html"
            echo "bytes=$(wc -c < "$item.html")"
            echo "-- channel names --"
            grep -oiE 'Asianet[^<]{0,120}|Zee Keralam[^<]{0,120}|Surya[^<]{0,120}' "$item.html" | head -120 || true
            echo "-- source/player terms --"
            grep -inE 'Sources|source|player|stream|playlist|m3u8|mpd|iframe|data-src|data-url|ajax|api' "$item.html" | head -200 || true
            echo "-- direct stream URLs --"
            grep -oE 'https?://[^[:space:]<>\"]+(m3u8|mpd)(\?[^[:space:]<>\"]*)?' "$item.html" | sort -u | head -200 || true
          done
