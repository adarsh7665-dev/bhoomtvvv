name: BHOOM player diagnostics

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch player script
        shell: bash
        run: |
          set -e
          curl -L --fail --silent --show-error --max-time 25 -A Mozilla/5.0 'https://bhoomtv.me/wp-content/themes/dooplay/assets/js/front.scripts.min.js?ver=2.5.5' -o player.js
          echo "bytes=$(wc -c < player.js)"
          python3 - <<'PY'
p=open('player.js',encoding='utf-8',errors='ignore').read()
terms=['admin-ajax.php','dooplay_player_ajax','player-option','dooplay_player_option','playeroptionsul','nume','data-post']
for term in terms:
    print('###',term)
    start=0
    count=0
    while count<20:
        i=p.lower().find(term.lower(),start)
        if i<0: break
        print(p[max(0,i-1000):min(len(p),i+2500)])
        print()
        start=i+len(term)
        count+=1
PY
