name: BHOOM source diagnostics

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Test BHOOM endpoints
        shell: bash
        run: |
          set +e
          urls=(
            "https://bhoomtv.org/"
            "http://bhoomtv.org/"
            "https://bhoomtv.org/live/mollywood-tv/"
            "https://bhoomtv.org/live/mollywood-plus/"
            "https://bhoomtv.net/"
            "https://bhoomtv.net/live/mollywood-tv/"
            "https://bhoomtv.net/live/mollywood-plus/"
            "https://bhoomtv.me/"
            "https://bhoomtv.me/live/mollywood-tv/"
            "https://bhoomtv.me/live/mollywood-plus/"
            "https://bhoomtv.org/wp-json/wp/v2/search?search=Mollywood"
            "https://bhoomtv.org/wp-json/wp/v2/pages?search=Mollywood&per_page=20"
            "https://bhoomtv.org/wp-json/wp/v2/posts?search=Mollywood&per_page=20"
          )
          for url in "${urls[@]}"; do
            echo "===== $url ====="
            curl -L --max-time 20 -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/130 Safari/537.36" -H "Accept: text/html,application/json,*/*" -sS -o /tmp/out -w "status=%{http_code} final=%{url_effective} bytes=%{size_download}\n" "$url"
            if [ -s /tmp/out ]; then
              head -c 1200 /tmp/out | tr '\r\n' ' ' | sed 's/[[:space:]]\+/ /g'
              echo
              echo
            fi
          done
