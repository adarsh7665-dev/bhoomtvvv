name: BHOOM player diagnostics

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect player script
        shell: bash
        run: |
          set -e
          curl -L --fail --silent --show-error --max-time 25 -A Mozilla/5.0 'https://bhoomtv.me/wp-content/themes/dooplay/assets/js/front.scripts.min.js?ver=2.5.5' -o player.js
          echo "bytes=$(wc -c < player.js)"
          echo "-- admin ajax --"
          grep -oE '.{0,600}admin-ajax\.php.{0,1600}' player.js | head -40 || true
          echo "-- dooplay player ajax --"
          grep -oE '.{0,600}dooplay_player_ajax.{0,1600}' player.js | head -40 || true
          echo "-- player option --"
          grep -oE '.{0,600}dooplay_player_option.{0,1600}' player.js | head -40 || true
          echo "-- playeroptionsul --"
          grep -oE '.{0,600}playeroptionsul.{0,1600}' player.js | head -40 || true
          echo "-- nume/post/action nearby --"
          grep -oE '.{0,600}(nume|data-post|action).{0,1200}' player.js | grep -Ei 'player|ajax|post|nume' | head -80 || true
