name: BHOOM geo API diagnostics

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Query geo API
        shell: bash
        run: |
          set -e
          for id in 443 1641; do
            echo "===== ID $id ====="
            curl --http1.1 --compressed -L --silent --show-error --connect-timeout 5 --max-time 12 -A Mozilla/5.0 -H 'Content-Type: application/x-www-form-urlencoded' -H 'Accept: application/json, text/plain, */*' -e "https://bhoomtv.net/geo/watch/$id" --data 'action=get_channel_detail&id='"$id" 'https://bhoomtv.net/geo/rest-api/public' -w ' STATUS=%{http_code}\n' || true
            echo
          done
