name: BHOOM player diagnostics

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect Dooplay AJAX script
        shell: bash
        run: |
          set -e
          curl --http1.1 --compressed -L --fail --silent --show-error --connect-timeout 5 --max-time 15 -A Mozilla/5.0 'https://bhoomtv.me/wp-content/themes/dooplay/assets/js/front.ajax.min.js?ver=2.5.5' -o ajax.js
          echo "bytes=$(wc -c < ajax.js)"
          python3 -c 'import re; p=open("ajax.js",errors="ignore").read(); terms=["dooplayer/v2","play_method","data-nume","data-post","dooplay_player_option","play_ajaxmd","player_api"]; [print("### "+t+"\n"+"\n---\n".join(re.findall(r"(?is).{0,1000}"+re.escape(t)+r".{0,2500}",p)[:20])) for t in terms]'
