name: BHOOM targeted diagnostics

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect BHOOM geo player
        shell: bash
        run: |
          set -e
          curl --http1.1 --compressed -L --fail --silent --show-error --connect-timeout 5 --max-time 12 -A Mozilla/5.0 -e 'https://bhoomtv.me/live/mollywood-tv/' 'https://bhoomtv.net/geo/watch/443' -o geo443.html
          echo '=== GEO 443 ==='
          grep -F 'rest-api/public' -A 8 -B 8 geo443.html | head -80 || true
          grep -F 'pData' -A 8 -B 8 geo443.html | head -80 || true
          grep -F 'fetch(' -A 8 -B 8 geo443.html | head -80 || true
          curl --http1.1 --compressed -L --fail --silent --show-error --connect-timeout 5 --max-time 12 -A Mozilla/5.0 -e 'https://bhoomtv.me/live/mollywood-tv/' 'https://bhoomtv.net/geo/watch/1641' -o geo1641.html
          echo '=== GEO 1641 ==='
          grep -F 'rest-api/public' -A 8 -B 8 geo1641.html | head -80 || true
          grep -F 'pData' -A 8 -B 8 geo1641.html | head -80 || true
          grep -F 'fetch(' -A 8 -B 8 geo1641.html | head -80 || true
          curl --http1.1 --compressed -L --fail --silent --show-error --connect-timeout 5 --max-time 12 -A Mozilla/5.0 -e 'https://bhoomtv.me/live/mollywood-plus/' 'https://nxliv.com/sunxt/Play.php?c=13' -o nx13.html
          echo '=== NX 13 ==='
          grep -F 'streamSource' -A 8 -B 8 nx13.html | head -80 || true
          grep -iF 'keyId' -A 5 -B 5 nx13.html | head -80 || true
          grep -iF 'clearKey' -A 5 -B 5 nx13.html | head -80 || true
          curl --http1.1 --compressed -L --fail --silent --show-error --connect-timeout 5 --max-time 12 -A Mozilla/5.0 -e 'https://bhoomtv.me/live/mollywood-plus/' 'https://nxliv.com/sunxt/Play.php?c=15' -o nx15.html
          echo '=== NX 15 ==='
          grep -F 'streamSource' -A 8 -B 8 nx15.html | head -80 || true
          grep -iF 'keyId' -A 5 -B 5 nx15.html | head -80 || true
          grep -iF 'clearKey' -A 5 -B 5 nx15.html | head -80 || true
